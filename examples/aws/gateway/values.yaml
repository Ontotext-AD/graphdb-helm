#
# This example shows how to deploy and expose GraphDB with the AWS Load Balancer Controller Gateway API support (HTTP).
# See https://kubernetes-sigs.github.io/aws-load-balancer-controller/
#
# Prerequisites:
#   AWS Load Balancer Controller v2.7+ installed with Gateway API support enabled.
#   Ref: https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/deploy/installation/
#

configuration:
  # Change this to your Route53 domain name or use nip.io after deployment by mapping
  # the public IP of the AWS Load Balancer.
  externalUrl: http://ip.address.nip.io/

ingress:
  enabled: false

gatewayApi:
  enabled: true
  gateway:
    className: alb
    # ALB's Gateway API implementation does NOT read alb.ingress.kubernetes.io/* annotations (those only
    # apply to the Ingress resource). Scheme/subnets/IP address type are set via a LoadBalancerConfiguration
    # CRD referenced here. Apply loadbalancerconfiguration.yaml from this folder before installing, or omit
    # parametersRef to get the AWS LBC default (an internal-only ALB).
    infrastructure:
      parametersRef:
        group: gateway.k8s.aws
        kind: LoadBalancerConfiguration
        name: graphdb-lb-config
  httpRoute:
    enabled: true

  # Required for ALB: without it, target-type defaults to "instance", which needs a NodePort/LoadBalancer
  # Service and fails against this chart's ClusterIP Service.
  targetGroupConfiguration:
    enabled: true
    defaultConfiguration:
      targetType: ip
