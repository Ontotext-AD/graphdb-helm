#
# This example shows how to deploy and expose GraphDB using Azure Application Gateway for Containers with HTTPS.
# TLS is terminated at the Gateway using a certificate stored in a Kubernetes Secret.
# See https://learn.microsoft.com/en-us/azure/application-gateway/for-containers/tls-termination
#
# Prerequisites:
#   Azure Application Gateway for Containers provisioned and the ALB Controller installed.
#   Create a TLS Secret with the certificate and private key:
#     kubectl create secret tls graphdb-tls --cert=cert.pem --key=key.pem
#
#   Alternatively, use cert-manager with Azure Key Vault integration:
#     https://learn.microsoft.com/en-us/azure/aks/csi-secrets-store-nginx-tls
#

configuration:
  externalUrl: https://graphdb.example.com/

ingress:
  enabled: false

gatewayApi:
  enabled: true
  gateway:
    # "azure-alb-external" if using the AKS-managed ALB Controller add-on (recommended, requires this
    # exact name - the controller rejects any other GatewayClass name). If you installed the ALB
    # Controller yourself via Helm (BYO), use whatever name you chose for your own GatewayClass instead.
    className: azure-alb-external
    annotations:
      # Reference to the ApplicationLoadBalancer resource managing this Gateway.
      # Required for both the AKS-managed add-on and a self-managed (BYO) ALB Controller installation.
      alb.networking.azure.io/alb-namespace: azure-alb-system
      alb.networking.azure.io/alb-name: graphdb-alb
    listeners:
      http:
        enabled: false
      https:
        enabled: true
        tls:
          certificateRefs:
            - name: graphdb-tls
  httpRoute:
    enabled: true
