apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nginx-gateway
spec:
  gatewayClassName: nginx
  listeners:
   - name: tls-passthrough
     protocol: TLS
     port: 443
     hostname: "graphdb.127.0.0.1.nip.io"
     tls:
       mode: Passthrough
     allowedRoutes:
       namespaces:
         from: All
       kinds:
         - kind: TLSRoute
           group: gateway.networking.k8s.io
