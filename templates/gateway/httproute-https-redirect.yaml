{{- if and .Values.gateway.httpRoute.enabled .Values.gateway.httpRoute.httpsRedirect.enabled }}
{{- $external_url := urlParse (include "graphdb.external-url" .) -}}
{{- $scheme := $external_url.scheme -}}
{{- $hostname := coalesce .Values.gateway.httpRoute.hostname $external_url.host -}}
{{- $path := coalesce .Values.gateway.httpRoute.matches.path $external_url.path "/" -}}
{{- if eq $scheme "https" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "graphdb.fullname.httproute.https-redirect" . }}
  namespace: {{ include "graphdb.namespace" . }}
  labels:
    {{- include "graphdb.labels" . | nindent 4 }}
    {{- with .Values.gateway.httpRoute.labels }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- with (mergeOverwrite (deepCopy .Values.annotations) .Values.gateway.httpRoute.annotations) }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.httpRoute.httpsRedirect.parentRefs }}
  parentRefs:
    {{- include "graphdb.tpl.list" (dict "items" . "root" $ ) | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ $hostname }}
    {{- range .Values.gateway.httpRoute.extraHostnames }}
    - {{ tpl . $ }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gateway.httpRoute.matches.type }}
            value: {{ $path }}
        {{- with .Values.gateway.httpRoute.matches.extraMatchers }}
          {{- include "graphdb.tpl.list" (dict "items" . "root" $ ) | nindent 8 }}
        {{- end }}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: {{ .Values.gateway.httpRoute.httpsRedirect.redirect.port }}
            statusCode:  {{ .Values.gateway.httpRoute.httpsRedirect.redirect.code }}
{{- end }}
{{- end }}
