{{- if .Values.gateway.httpRoute.enabled }}
{{- $external_url := urlParse (include "graphdb.external-url" .) -}}
{{- $hostname := coalesce .Values.gateway.httpRoute.hostname $external_url.host -}}
{{- $path := coalesce .Values.gateway.httpRoute.matches.path $external_url.path "/" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "graphdb.fullname" . }}
  namespace: {{ include "graphdb.namespace" . }}
  labels:
    {{- include "graphdb.labels" . | nindent 4 }}
    {{- with .Values.gateway.httpRoute.labels }}
      {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
  {{- with (mergeOverwrite (deepCopy .Values.annotations) .Values.gateway.httpRoute.annotations) }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.gateway.httpRoute.parentRefs }}
  parentRefs:
    {{- include "graphdb.tpl.list" (dict "items" . "root" $ ) | nindent 4 }}
  {{- end }}
  hostnames:
    - {{ $hostname }}
    {{- range .Values.gateway.httpRoute.extraHostnames }}
    - {{ tpl . $ }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.gateway.httpRoute.matches.type }}
            value: {{ $path }}
        {{- with .Values.gateway.httpRoute.matches.extraMatchers }}
          {{- include "graphdb.tpl.list" (dict "items" . "root" $ ) | nindent 8 }}
        {{- end }}
      {{- if or (ne $path "/") .Values.gateway.httpRoute.filters.extraFilters }}
      filters:
        {{- if and (ne $path "/") .Values.gateway.httpRoute.filters.replacePrefix.enabled }}
        # GraphDB listens on the root path, so we need to remove any context paths
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        {{- end }}
        {{- with .Values.gateway.httpRoute.filters.extraFilters }}
          {{- include "graphdb.tpl.list" (dict "items" . "root" $ ) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if or .Values.gateway.httpRoute.timeouts.request .Values.gateway.httpRoute.timeouts.backendRequest }}
      timeouts:
        {{- if .Values.gateway.httpRoute.timeouts.request }}
        request: {{ .Values.gateway.httpRoute.timeouts.request }}
        {{- end }}
        {{- if .Values.gateway.httpRoute.timeouts.backendRequest }}
        backendRequest: {{ .Values.gateway.httpRoute.timeouts.backendRequest }}
        {{- end }}
      {{- end }}
      backendRefs:
        {{- if gt (int .Values.replicas) 1 }}
        - group: ""
          kind: Service
          name: {{ include "graphdb-proxy.fullname" . }}
          port: {{ coalesce .Values.gateway.httpRoute.backend.servicePort .Values.proxy.service.ports.http }}
          weight: {{ .Values.gateway.httpRoute.backend.weight }}
        {{- else }}
        - group: ""
          kind: Service
          name: {{ include "graphdb.fullname" . }}
          port: {{ coalesce .Values.gateway.httpRoute.backend.servicePort .Values.service.ports.http }}
          weight: {{ .Values.gateway.httpRoute.backend.weight }}
        {{- end }}
        {{- with .Values.gateway.httpRoute.backend.extraBackends }}
          {{- include "graphdb.tpl.list" (dict "items" . "root" $ ) | nindent 8 }}
        {{- end }}
    {{- with .Values.gateway.httpRoute.extraRules }}
      {{- include "graphdb.tpl.list" (dict "items" . "root" $ ) | nindent 4 }}
    {{- end }}
{{- end }}
